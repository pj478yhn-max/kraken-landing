<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kraken Rewards & Ink Points Hub</title>
    <style>
        :root {
            --bg-color: #0d0f17;
            --card-bg: #161926;
            --accent-purple: #7952f5;
            --accent-green: #00e676;
            --text-color: #ffffff;
            --text-secondary: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #7952f5, #00e676);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 14px;
            margin: 0;
        }

        .bonus-badge {
            background: rgba(0, 230, 118, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(0, 230, 118, 0.3);
            padding: 8px 16px;
            border-radius: 50px;
            display: inline-block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .code-box {
            background: rgba(255,255,255,0.03);
            border: 2px dashed var(--accent-purple);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .code-title {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .code-value {
            font-family: monospace;
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            letter-spacing: 2px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 12px;
            box-sizing: border-box;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: var(--accent-purple);
            color: white;
            box-shadow: 0 4px 15px rgba(121, 82, 245, 0.4);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.08);
            color: white;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .stat-card {
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 10px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .stat-val {
            font-size: 18px;
            font-weight: bold;
            margin-top: 4px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--accent-green);
            color: #000;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Kraken Reward Hub</h1>
            <p>Join & claim up to $300 in bonus rewards</p>
        </div>

        <div class="bonus-badge">
            🎁 Up to $300 Signup Bonus
        </div>

        <div class="code-box">
            <div class="code-title">Your Exclusive Invite Code</div>
            <div class="code-value" id="code">557kys3g</div>
        </div>

        <button class="btn btn-primary" onclick="copyCode()">Copy Code & Get Started</button>
        <a class="btn btn-secondary" href="https://invite.kraken.com/JDNW/2x557kys3g" target="_blank">Open Kraken Direct Link</a>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Ink Points Total</div>
                <div class="stat-val" style="color: #7952f5;">1,792 pts</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Season Progress</div>
                <div class="stat-val" style="color: #00e676;">512 / 1,000</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">✅ Code Copied to Clipboard!</div>

    <script>
        function copyCode() {
            navigator.clipboard.writeText("557kys3g");
            
            const toast = document.getElementById("toast");
            toast.classList.add("show");
            
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }

            setTimeout(() => {
                toast.classList.remove("show");
                window.location.href = "https://invite.kraken.com/JDNW/2x557kys3g";
            }, 1200);
        }
    </script>
</body>
</html>
